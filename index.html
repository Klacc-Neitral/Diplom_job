<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProgTest - Профиль (MVP)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <h2>Проверка окружения</h2>
    <pre id="output">Загрузка...</pre>

    <script>
        (function() {
            const output = document.getElementById('output');
            
            function detectPlatform() {
                if (window.vkBridge && typeof window.vkBridge.send === 'function') {
                    return 'vk';
                }
                if (window.location.search.includes('vk_app_id') || 
                    window.location.hash.includes('vk_platform')) {
                    return 'vk';
                }
                if (window.Telegram && window.Telegram.WebApp) {
                    return 'telegram';
                }

                if (window.location.search.includes('tgWebAppData')) {
                    return 'telegram';
                }
                return 'browser';
            }
            
            let platform = detectPlatform();
            output.textContent = `Определено окружение: ${platform}\n\n`;
            
            if (platform === 'vk') {
                if (!window.vkBridge) {
                    const script = document.createElement('script');
                    script.src = 'https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js';
                    script.onload = () => initVK();
                    script.onerror = () => {
                        output.textContent += '❌ Ошибка загрузки VK Bridge\n';
                    };
                    document.head.appendChild(script);
                } else {
                    initVK();
                }
                
                function initVK() {
                    output.textContent += '🔄 Отправляем VKWebAppInit...\n';
                    window.vkBridge.send('VKWebAppInit')
                        .then(() => {
                            output.textContent += 'VKWebAppInit успешно отправлен\n';
                            return window.vkBridge.send('VKWebAppGetUserInfo');
                        })
                        .then(user => {
                            if (user) {
                                output.textContent += `Пользователь: ${user.first_name} ${user.last_name || ''} (id: ${user.id})\n`;
                            }
                        })
                        .catch(err => {
                            output.textContent += `Ошибка при инициализации VK: ${err.message || err}\n`;
                        });
                }
            }
            
            else if (platform === 'telegram') {
                const waitForTelegram = setInterval(() => {
                    if (window.Telegram && window.Telegram.WebApp) {
                        clearInterval(waitForTelegram);
                        const tg = window.Telegram.WebApp;
                        tg.ready();
                        tg.expand();
                        
                        output.textContent += '✅ Telegram WebApp готов\n';
                        
                        const user = tg.initDataUnsafe?.user;
                        if (user) {
                            output.textContent += 
                                ` Пользователь:\n` +
                                `  ID: ${user.id}\n` +
                                `  Имя: ${user.first_name} ${user.last_name || ''}\n` +
                                `  Username: @${user.username || 'нет'}\n`;
                        } else {
                            output.textContent += 'Данные пользователя отсутствуют (возможно, открыто не из Telegram)\n';
                        }
                    }
                }, 50);
                
                setTimeout(() => {
                    if (!window.Telegram || !window.Telegram.WebApp) {
                        output.textContent += 'Telegram SDK не загрузился вовремя\n';
                    }
                }, 3000);
            }
            
            else {
                output.textContent += 'Приложение запущено в обычном браузере\n';
                output.textContent += 'Для работы мини-аппа откройте через VK или Telegram\n';
            }
            
            output.textContent += '\nЗагрузка основного приложения...\n';
        })();
    </script>
    
    <!-- Ваш основной модуль -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
